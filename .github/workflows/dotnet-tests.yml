name: CI/CD

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    # A real Postgres, so the Postgres migrations and the encrypted key storage are tested on the
    # database the site runs on, not only on SQLite. It exists for this run only; the password is
    # not a secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the build tools
        run: npm ci

      # The stylesheet and the Tailwind theme are generated from design/tokens.json and then
      # committed, so running the site needs no Node. This proves the committed copies still
      # match the tokens: if somebody changes a token and forgets `npm run build`, it fails
      # here rather than shipping a stylesheet that does not match the design (E1, H1).
      - name: Check the built stylesheet matches the design tokens
        run: |
          npm run build
          if ! git diff --exit-code -- PhilisaAbantuBethu/wwwroot/css/app.css tailwind.tokens.js; then
            echo "::error::design/tokens.json changed without running 'npm run build'. Commit the rebuilt files."
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore PhilisaAbantuBethu.slnx

      - name: Build
        run: dotnet build PhilisaAbantuBethu.slnx --no-restore --configuration Release

      - name: Run tests
        env:
          PAB_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
        run: >
          dotnet test PhilisaAbantuBethu.Tests --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
          --collect:"XPlat Code Coverage"

      # How much of the back end the tests actually reach, on the run's summary page (D3).
      - name: Summarise the coverage
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:TestResults/coverage -reporttypes:"Html;MarkdownSummaryGithub"
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the test results and the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      # The same image Render builds, so a broken Dockerfile is caught before it reaches main.
      - name: Build the Docker image
        run: docker build --tag philisa-web:ci .

  deploy:
    name: Deploy to Render
    # Only after the tests pass, and only for main.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-production
      cancel-in-progress: false
    env:
      # The hook is a private web address: anyone who has it can start a deploy, so it is a secret.
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      SITE_URL: ${{ vars.SITE_URL || 'https://philisa-abafazi-bethu-web.onrender.com' }}

    steps:
      # Until the secret is added the job says what's missing instead of failing the run.
      - name: Check the deploy hook is set
        id: secrets
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Deploy skipped: add RENDER_DEPLOY_HOOK under Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Asks Render to build and deploy exactly the commit that just passed the tests, rather
      # than whatever main happens to be when Render gets there.
      - name: Deploy this commit
        if: steps.secrets.outputs.ready == 'true'
        run: curl --fail --silent --show-error --output /dev/null --request POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"

      # Render builds in the background and only switches visitors to the new version once its own
      # /health check passes. This confirms the site is answering afterwards.
      - name: Check the live site is healthy
        if: steps.secrets.outputs.ready == 'true'
        run: curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors "$SITE_URL/health"
